<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Listening - Nexus</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <a href="index.html" style="text-decoration:none; color:inherit;"><h1>NEXUS</h1></a>
    <p>Listening</p>
  </header>

  <!-- 🎵 MUSIC PLAYLIST SECTION -->
  <section class="music-section" id="music-playlist">
    <h2>🎵 Music Playlist</h2>
    <p class="music-subtitle">Artists and songs I keep coming back to.</p>

    <div class="music-artists-grid">

      <!-- Artist: Talha Anjum -->
      <div class="artist-card">
        <div class="artist-photo">
          <img src="images/music/talhaanjum.jpg" alt="Talha Anjum">
        </div>
        <div class="artist-info">
          <h3>Talha Anjum</h3>
          <p class="artist-role">Rapper • Lyricist</p>
          <div class="artist-songs">
            <div class="song-item">
              <span class="song-icon">🎧</span>
              <span class="song-name">Gumaan</span>
            </div>
            <div class="song-item">
              <span class="song-icon">🎧</span>
              <span class="song-name">Downers at Dusk</span>
            </div>
            <div class="song-item">
              <span class="song-icon">🎧</span>
              <span class="song-name">Departure Lane</span>
            </div>
          </div>
        </div>
      </div>

    </div>
  </section>

  <footer>
    <p class="watermark">Managed by <strong>Abhinav</strong></p>
    <p class="contact">abhinavchamoli00@gmail.com</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
