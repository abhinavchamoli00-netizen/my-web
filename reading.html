<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reading - Nexus</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <a href="index.html" style="text-decoration:none; color:inherit;">
      <h1>NEXUS</h1>
    </a>
    <p>Reading</p>
  </header>

  <section id="reading">
    <h2>Reading</h2>
    <div class="card-container">
      <div class="poster-card"><img src="images/reading/gunahonkadevta.jpg.jpg" alt="गुनाहों का देवता"><p>गुनाहों का देवता</p></div>
     <div class="poster-card">
    <img src="images/reading/book2.jpg" alt="दीवार में एक खिड़की रहती थी">
<p>दीवार में एक खिड़की रहती थी</p>
</div>
  </section>

  <!-- 🟢 FEEDBACK FORM -->
<div class="feedback-section">
  <h3>📩 Send Feedback</h3>
  <p>Found a broken link? Have a suggestion? Send us a message!</p>
  <form id="feedbackForm">
    <input type="text" id="feedbackName" placeholder="Your name (optional)" />
    <textarea id="feedbackMessage" placeholder="Type your message here..." required></textarea>
    <button type="submit" id="feedbackSubmit">Send Message</button>
  </form>
  <p id="feedbackStatus"></p>
</div>

<script>
  document.getElementById('feedbackForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const name = document.getElementById('feedbackName').value.trim();
    const message = document.getElementById('feedbackMessage').value.trim();
    const statusEl = document.getElementById('feedbackStatus');
    const submitBtn = document.getElementById('feedbackSubmit');

    if (!message) return;

    submitBtn.disabled = true;
    submitBtn.textContent = 'Sending...';
    statusEl.textContent = '';

    try {
      const res = await fetch('/api/feedback', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, message })
      });
      const data = await res.json();

      if (data.success) {
        statusEl.textContent = '✅ Thanks! Your feedback has been sent.';
        statusEl.style.color = '#2ecc71';
        document.getElementById('feedbackForm').reset();
      } else {
        statusEl.textContent = '❌ Something went wrong. Please try again.';
        statusEl.style.color = '#e74c3c';
      }
    } catch (err) {
      statusEl.textContent = '❌ Network error. Please try again.';
      statusEl.style.color = '#e74c3c';
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Send Message';
    }
  });
</script>

<footer>
    <p class="watermark">Handled by <strong>Abhinav</strong> with Team <strong>Alpha</strong></p>
    <p class="contact">abhinavchamoli00@gmail.com</p>
  </footer>

</body>
</html>
